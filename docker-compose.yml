name: biblioteca-rag

# Lo que comparten la API y el worker: misma imagen, misma configuración, misma carpeta temporal.
x-app: &app
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    # Dentro de la red de compose los servicios se llaman por su nombre, no `localhost`.
    DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/biblioteca_rag
    # G6: lo público entra con su propio usuario (lo crea docker/arrancar-api.sh al arrancar).
    DATABASE_URL_PUBLICA: postgresql+psycopg://biblioteca_web:${PUBLICO_DB_PASSWORD:?definir PUBLICO_DB_PASSWORD en .env}@db:5432/biblioteca_rag
    # D6: Redis exige contraseña. Sin REDIS_PASSWORD en .env, compose no arranca.
    REDIS_URL: redis://:${REDIS_PASSWORD:?definir REDIS_PASSWORD en .env}@redis:6379
    INGESTA_TEMPORAL: /var/lib/biblioteca-rag/ingesta
    # Variable propia para Docker: OLLAMA_BASE_URL del .env sirve para correr fuera de Docker.
    # Por defecto, el servicio `ollama` de abajo (perfil `ollama`).
    OLLAMA_BASE_URL: ${OLLAMA_URL_DOCKER:-http://ollama:11434}
  volumes:
    - ingesta:/var/lib/biblioteca-rag/ingesta
    # Modelos de Docling y tokenizador de bge-m3: se bajan una vez, no en cada arranque.
    - modelos_hf:/home/appuser/.cache
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  api:
    <<: *app
    ports:
      # Solo esta máquina; la exposición a internet va por Cloudflare Tunnel (docker-compose.prod.yml).
      - "127.0.0.1:8000:8000"

  worker:
    <<: *app
    command: ["arq", "app.worker.WorkerSettings"]
    # El HEALTHCHECK de la imagen es el HTTP de la API; el worker no sirve HTTP.
    healthcheck:
      disable: true

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      # El valor por defecto es solo para desarrollo local; fuera de esta máquina, definirla en .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: biblioteca_rag
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d biblioteca_rag"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # AOF en un volumen: recrear el contenedor no pierde las tareas encoladas. Lo que se pierda
    # igual (un corte entre escrituras) lo cierra como error el barrido del worker.
    # La contraseña llega por entorno y no queda escrita en el comando del compose.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?definir REDIS_PASSWORD en .env}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Opcional: `docker compose --profile ollama up`. Ollama del host escucha solo en 127.0.0.1 y
  # no se alcanza desde un contenedor; este corre en la red de compose y no publica puertos.
  # Modelos: volumen propio (bajarlos con `docker compose exec ollama ollama pull bge-m3`), o los
  # del host en solo lectura: OLLAMA_MODELOS=/usr/share/ollama/.ollama/models OLLAMA_MODELOS_MODO=ro
  ollama:
    # Misma versión que el Ollama del host: las más nuevas migran el formato de los manifiestos
    # al arrancar y fallan con los modelos del host montados en solo lectura.
    image: ollama/ollama:0.34.0
    profiles: ["ollama"]
    environment:
      OLLAMA_NOPRUNE: "1"  # con los modelos en solo lectura, no intentar limpiar blobs
    volumes:
      - ${OLLAMA_MODELOS:-ollama_modelos}:/root/.ollama/models:${OLLAMA_MODELOS_MODO:-rw}
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  ingesta:
  modelos_hf:
  ollama_modelos:
